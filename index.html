<!DOCTYPE html>
<html lang="en">
<head>
    <title>Web Projects</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 1.5rem;
            line-height: 1.6;
            color: #333;
            font-size: 1.4rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1em;
            text-align: center;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 0.6em 0;
        }
        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            padding: 0.4em 0;
        }
        a:hover {
            text-decoration: underline;
        }
        .description::before {
            content: "\2012";
            margin: 0 0.5em;
            color: #aaa;
        }
        .description {
            color: #555;
            font-weight: normal;
        }    
        footer {
            margin-top: 4em;
            text-align: center;
            font-size: 1rem;
            color: #888;
        }

        @media (max-width: 600px) {
            html {
                font-size: 90%;
            }
        }
        @media (max-width: 480px) {
            html {
                font-size: 80%;
            }
        }
        @media (max-width: 360px) {

            }
